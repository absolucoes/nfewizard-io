name: Publicar fork CTe no GitHub Packages
on:
  push:
    tags:
      - "vanir-cte-v*"
permissions:
  contents: read
  packages: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@absolucoes"
      - name: Validar versão da tag
        id: versao
        shell: bash
        run: |
          set -euo pipefail
          versao="${GITHUB_REF_NAME#vanir-cte-v}"
          [[ "$versao" =~ ^[0-9]+\.[0-9]+\.[0-9]+-vanir\.[1-9][0-9]*$ ]]
          echo "valor=$versao" >> "$GITHUB_OUTPUT"
      - name: Instalar e compilar
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @nfewizard/types build
          pnpm --filter @nfewizard/cte build
      - name: Publicar pacote versionado
        working-directory: packages/cte
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          npm pkg set name="@absolucoes/nfewizard-cte" version="${{ steps.versao.outputs.valor }}"
          pnpm publish --registry=https://npm.pkg.github.com --no-git-checks --access=restricted --tag=vanir
